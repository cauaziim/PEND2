// ======================================================
// ÁUDIO
// ======================================================

let audio = null;

function iniciarAudio() {

    if (!audio) {

        audio =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if (
        audio.state ===
        "suspended"
    ) {

        audio.resume();

    }
}


function beep(
    frequencia,
    duracao,
    tipo = "square",
    volume = 0.04
) {

    iniciarAudio();

    const osc =
        audio.createOscillator();

    const ganho =
        audio.createGain();

    osc.type =
        tipo;

    osc.frequency.value =
        frequencia;

    ganho.gain.setValueAtTime(
        volume,
        audio.currentTime
    );

    ganho.gain.exponentialRampToValueAtTime(
        0.001,
        audio.currentTime +
        duracao
    );

    osc.connect(ganho);

    ganho.connect(
        audio.destination
    );

    osc.start();

    osc.stop(
        audio.currentTime +
        duracao
    );
}


// ======================================================
// PARTÍCULAS
// ======================================================

let particulas = [];


function criarParticulas(
    x,
    y,
    cor,
    quantidade = 10
) {

    for (
        let i = 0;
        i < quantidade;
        i++
    ) {

        particulas.push({

            x: x,

            y: y,

            vx:
                Math.random() *
                8 -
                4,

            vy:
                Math.random() *
                -8 -
                1,

            vida:
                25 +
                Math.random() *
                30,

            tamanho:
                2 +
                Math.random() *
                4,

            cor: cor

        });

    }

}


function atualizarParticulas() {

    for (
        let i =
            particulas.length - 1;
        i >= 0;
        i--
    ) {

        const p =
            particulas[i];

        p.x +=
            p.vx;

        p.y +=
            p.vy;

        p.vy +=
            0.35;

        p.vida--;

        if (
            p.vida <= 0
        ) {

            particulas.splice(
                i,
                1
            );

        }

    }

}


function desenharParticulas() {

    particulas.forEach(
        p => {

            ctx.globalAlpha =
                Math.max(
                    0,
                    p.vida / 50
                );

            ctx.fillStyle =
                p.cor;

            ctx.fillRect(
                p.x,
                p.y,
                p.tamanho,
                p.tamanho
            );

        }
    );

    ctx.globalAlpha = 1;
}

// ======================================================
// TECLAS
// ======================================================

const teclas = {};


document.addEventListener(
    "keydown",
    e => {

        const tecla =
            e.key.toLowerCase();

        teclas[tecla] =
            true;


        if (
            [
                "a",
                "d",
                "w",
                "s",
                "j",
                "k",
                "l",
                "shift",
                "e",
                "enter",
                "escape"
            ].includes(tecla)
        ) {

            e.preventDefault();

        }


        iniciarAudio();


        // MENU
        if (
            tela ===
            "menu"
        ) {

            if (
                tecla ===
                "enter"
            ) {

                iniciarTorre();

            }

        }


        // LOJA
        if (
            tela ===
            "loja"
        ) {

            const numero =
                Number(tecla);

            if (
                numero >= 1 &&
                numero <= 6
            ) {

                const ids =
                    Object.keys(
                        roupas
                    );

                comprarOuEquiparRoupa(
                    ids[
                        numero - 1
                    ]
                );

            }

        }


        // CLASSES
        if (
            tela ===
            "personagem"
        ) {

            if (
                tecla === "1"
            ) {

                escolherClasse(
                    "guerreiro"
                );

            }

            if (
                tecla === "2"
            ) {

                escolherClasse(
                    "tanque"
                );

            }

            if (
                tecla === "3"
            ) {

                escolherClasse(
                    "veloz"
                );

            }

        }


        // FINAL
        if (
            fim &&
            tecla ===
            "enter"
        ) {

            tela =
                "menu";

            fim =
                false;

            jogador.dancando =
                false;

        }


        // ESC
        if (
            tecla ===
            "escape"
        ) {

            if (
                tela !==
                "jogo"
            ) {

                tela =
                    "menu";

            }
            else {

                tela =
                    "menu";

                fim =
                    false;

                esperando =
                    false;

                jogador.dancando =
                    false;

            }

        }

    }
);


document.addEventListener(
    "keyup",
    e => {

        teclas[

// ======================================================
// MOEDAS
// ======================================================

function ganharMoedas(
    valor
) {

    moedas +=
        valor;

    popup(
        `+${valor} moedas`
    );

    salvar();

}


// ======================================================
// XP
// ======================================================

function ganharXP(
    valor
) {

    xp +=
        valor;


    while (
        xp >=
        nivel * 1000
    ) {

        xp -=
            nivel * 1000;

        nivel++;


        popup(
            `NÍVEL ${nivel}!`
        );


        beep(
            800,
            .15,
            "sine",
            .08
        );

    }


    salvar();

}


// ======================================================
// CLASSE
// ======================================================

function escolherClasse(
    nome
) {

    classeAtual =
        nome;

    salvar();

    popup(
        `${classes[nome].nome} selecionado`
    );

}

        jogador.altura;

    jogador.vy = 0;

// ======================================================

        ];

        dados.boss
            ? 830
            : 850;

        CHAO -
        inimigo.altura;

    inimigo.atacando =
        false;

    inimigo.contadorAtaque =
        55 +
        Math.random() * 100;


    configurarJogador();

}


// ======================================================
// JOGADOR
// ======================================================

function atualizarJogador() {

    if (
        tela !== "jogo" ||
        fim
    ) {

        return;

    }


    // ==============================================
    // DANÇA
    // ==============================================

    if (
        jogador.dancando
    ) {

        jogador.dancaTimer--;


        jogador.x =
            560 +
            Math.sin(
                Date.now() *
                .008
            ) * 75;


        jogador.y =
            CHAO -
            jogador.altura -
            Math.abs(
                Math.sin(
                    Date.now() *
                    .012
                )
            ) * 25;


        if (
            Math.random() < .18
        ) {

            criarParticulas(
                jogador.x + 25,
                jogador.y + 20,
                skins[
                    skinAtual
                ].efeito,
                3
            );

        }


        if (
            jogador.dancaTimer <= 0
        ) {

            jogador.dancando =
                false;

            fim =
                true;

        }


        return;

    }


    if (
        esperando
    ) {

        return;

    }


    jogador.vx =
        0;


    // ==============================================
    // AGACHAR
    // ==============================================

    jogador.agachado =
        !!teclas["s"] &&
        !jogador.atacando;


    // ==============================================
    // DEFESA
    // ==============================================

    jogador.defendendo =
        !!teclas["l"] &&
        !jogador.atacando &&
        !jogador.agachado;


    // ==============================================
    // MOVIMENTO
    // ==============================================

    if (
        !jogador.defendendo
    ) {

        if (
            teclas["a"]
        ) {

            jogador.vx =
                -jogador.velocidade;

            jogador.olhando =
                -1;

        }


        if (
            teclas["d"]
        ) {

            jogador.vx =
                jogador.velocidade;

            jogador.olhando =
                1;

        }

    }


    // ==============================================
    // PULO
    // ==============================================

    if (
        teclas["w"] &&
        !jogador.noAr &&
        !jogador.agachado &&
        !jogador.defendendo
    ) {

        jogador.vy =
            -14;

        jogador.noAr =
            true;


        beep(
            250,
            .05,
            "sine",
            .03
        );

    }


    // ==============================================
    // DASH
    // ==============================================

    if (
        teclas["shift"] &&
        jogador.dashTimer <= 0 &&
        !jogador.agachado &&
        !jogador.defendendo
    ) {

        jogador.x +=
            jogador.olhando *
            80;


        jogador.dashTimer =
            40;


        jogador.invulneravel =
            12;


        criarParticulas(
            jogador.x,
            jogador.y + 50,
            skins[
                skinAtual
            ].efeito,
            12
        );


        beep(
            420,
            .08,
            "sawtooth",
            .04
        );


        teclas["shift"] =
            false;

    }


    if (
        jogador.dashTimer > 0
    ) {

        jogador.dashTimer--;

    }


    // ==============================================
    // ATAQUES
    // ==============================================

    if (
        !jogador.atacando &&
        !jogador.defendendo &&
        !jogador.agachado
    ) {

        if (
            teclas["j"]
        ) {

            iniciarAtaque(
                "soco"
            );

        }

        else if (
            teclas["k"]
        ) {

            iniciarAtaque(
                "chute"
            );

        }

        else if (
            teclas["e"] &&
            jogador.energia >= 30
        ) {

            iniciarEspecial();

            teclas["e"] =
                false;

        }

    }


    // ==============================================
    // FÍSICA
    // ==============================================

    jogador.x +=
        jogador.vx;


    jogador.vy +=
        .65;


    jogador.y +=
        jogador.vy;


    if (
        jogador.y >=
        CHAO -
        jogador.altura
    ) {

        jogador.y =
            CHAO -
            jogador.altura;

        jogador.vy =
            0;

        jogador.noAr =
            false;

    }


    jogador.x =
        Math.max(
            210,
            Math.min(
                950,
                jogador.x
            )
        );


    // energia recupera
    if (
        jogador.energia <
        jogador.energiaMax
    ) {

        jogador.energia +=
            .08;

    }


    // ==============================================
    // ATAQUE TIMER
    // ==============================================

    if (
        jogador.ataqueTimer > 0
    ) {

        jogador.ataqueTimer--;


        if (
            jogador.ataqueTimer === 10
        ) {

            verificarAtaque();

        }

    }
    else {

        jogador.atacando =
            false;

        jogador.tipoAtaque =
            "";

    }


    if (
        jogador.invulneravel > 0
    ) {

        jogador.invulneravel--;

    }

}


// ======================================================
// ATAQUE
// ======================================================

function iniciarAtaque(
    tipo
) {

    jogador.atacando =
        true;

    jogador.tipoAtaque =
        tipo;

    jogador.ataqueTimer =
        21;


    beep(
        tipo === "soco"
            ? 180
            : 130,
        .06,
        "square",
        .04
    );

}


function iniciarEspecial() {

    jogador.energia -=
        30;


    jogador.atacando =
        true;


    jogador.tipoAtaque =
        "especial";


    jogador.ataqueTimer =
        30;


    criarParticulas(
        jogador.x + 25,
        jogador.y + 35,
        skins[
            skinAtual
        ].efeito,
        25
    );


    beep(
        600,
        .18,
        "sine",
        .08
    );

}


// ======================================================
// ATAQUE DO JOGADOR
// ======================================================

function verificarAtaque() {

    const distancia =
        Math.abs(
            (
                jogador.x + 26
            ) -
            (
                inimigo.x + 26
            )
        );


    let alcance =
        80;


    let dano =
        jogador.ataque;


    if (
        jogador.tipoAtaque ===
        "chute"
    ) {

        alcance =
            105;

        dano +=
            7;

    }


    if (
        jogador.tipoAtaque ===
        "especial"
    ) {

        alcance =
            160;

        dano +=
            35;

    }


    dano +=
        Math.floor(
            combo *
            .8
        );


    if (
        distancia >
        alcance
    ) {

        return;

    }


    if (
        inimigo.invulneravel >
        0
    ) {

        return;

    }


    inimigo.vida -=
        dano;


    inimigo.invulneravel =
        10;


    inimigo.x +=
        jogador.olhando *
        (
            inimigo.boss
                ? 8
                : 24
        );


    combo++;


    maiorCombo =
        Math.max(
            maiorCombo,
            combo
        );


    pontos +=
        dano * 5;


    criarParticulas(
        inimigo.x + 25,
        inimigo.y + 35,
        skins[
            skinAtual
        ].efeito,
        jogador.tipoAtaque ===
            "especial"
            ? 25
            : 10
    );


    beep(
        jogador.tipoAtaque ===
            "especial"
            ? 90
            : 70,
        .1,
        "triangle",
        .06
    );


    if (
        combo >= 5
    ) {

        ganharMoedas(2);

    }


    if (
        inimigo.vida <= 0
    ) {

        inimigo.vida =
            0;

        vencerAndar();

    }

}


// ======================================================
// IA
// ======================================================

function atualizarInimigo() {

    if (
        tela !== "jogo" ||
        fim ||
        esperando
    ) {

        return;

    }


    const dx =
        (
            jogador.x +
            26
        ) -
        (
            inimigo.x +
            26
        );


    inimigo.olhando =
        dx >= 0
            ? 1
            : -1;


    const distancia =
        Math.abs(
            dx
        );


    if (
        distancia >
        (
            inimigo.boss
                ? 110
                : 85
        )
    ) {

        inimigo.x +=
            inimigo.olhando *
            inimigo.velocidade;

    }


    if (
        inimigo.contadorAtaque >
        0
    ) {

        inimigo.contadorAtaque--;

    }


    if (
        distancia <=
        (
            inimigo.boss
                ? 130
                : 90
        ) &&
        inimigo.contadorAtaque <=
        0 &&
        !inimigo.atacando
    ) {

        inimigo.atacando =
            true;

        inimigo.ataqueTimer =
            25;


        inimigo.contadorAtaque =
            inimigo.boss
                ? 40 +
                  Math.random() * 50
                : 55 +
                  Math.random() * 80;


        if (
            inimigo.boss
        ) {

            criarParticulas(
                inimigo.x + 25,
                inimigo.y + 75,
                "#ffd45a",
                12
            );

            beep(
                100,
                .1,
                "square",
                .05
            );

        }

    }


    if (
        inimigo.atacando
    ) {

        inimigo.ataqueTimer--;


        if (
            inimigo.ataqueTimer ===
            11
        ) {

            ataqueInimigo();

        }


        if (
            inimigo.ataqueTimer <= 0
        ) {

            inimigo.atacando =
                false;

        }

    }


    if (
        inimigo.invulneravel >
        0
    ) {

        inimigo.invulneravel--;

    }


    inimigo.x =
        Math.max(
            210,
            Math.min(
                970,
                inimigo.x
            )
        );

}


// ======================================================
// ATAQUE INIMIGO
// ======================================================

function ataqueInimigo() {

    const distancia =
        Math.abs(
            (
                jogador.x + 26
            ) -
            (
                inimigo.x + 26
            )
        );


    const alcance =
        inimigo.boss
            ? 135
            : 90;


    if (
        distancia >
        alcance
    ) {

        return;

    }


    if (
        jogador.invulneravel >
        0
    ) {

        return;

    }


    if (
        jogador.defendendo ||
        jogador.agachado
    ) {

        criarParticulas(
            jogador.x + 25,
            jogador.y + 35,
            "#ffffff",
            8
        );


        beep(
            330,
            .08,
            "square",
            .06
        );


        return;

    }


    const dano =
        inimigo.ataque;


    jogador.vida -=
        dano;


    jogador.invulneravel =
        20;


    combo =
        0;


    jogador.x -=
        inimigo.olhando *
        20;


    criarParticulas(
        jogador.x + 25,
        jogador.y + 35,
        "#ff7777",
        10
    );


    beep(
        55,
        .12,
        "triangle",
        .08
    );


    if (
        jogador.vida <= 0
    ) {

        jogador.vida =
            0;

        fim =
            true;

    }

}


// ======================================================
// CURA
// ======================================================

const cura = {

    ativa:
        false,

    x:
        0,

    y:
        CHAO - 30,

    tamanho:
        24,

    contador:
        600
};


function atualizarCura() {

    if (
        tela !== "jogo" ||
        fim
    ) {

        return;

    }


    if (
        !cura.ativa
    ) {

        cura.contador--;


        if (
            cura.contador <= 0
        ) {

            criarCura();

        }


        return;

    }


    cura.y =
        CHAO -
        30 +
        Math.sin(
            Date.now() *
            .006
        ) * 5;


    const distanciaX =
        Math.abs(
            (
                jogador.x + 26
            ) -
            cura.x
        );


    const distanciaY =
        Math.abs(
            (
                jogador.y + 45
            ) -
            cura.y
        );


    if (
        distanciaX < 48 &&
        distanciaY < 70
    ) {

        if (
            jogador.vida <
            jogador.vidaMax
        ) {

            const antes =
                jogador.vida;


            jogador.vida =
                Math.min(
                    jogador.vidaMax,
                    jogador.vida +
                    250
                );


            const recuperado =
                jogador.vida -
                antes;


            popup(
                `+${recuperado} HP`
            );


            criarParticulas(
                cura.x,
                cura.y,
                "#49ff70",
                30
            );


            beep(
                700,
                .15,
                "sine",
                .08
            );


            cura.ativa =
                false;


            cura.contador =
                600;

        }

    }

}


function criarCura() {

    cura.ativa =
        true;


    cura.x =
        300 +
        Math.random() *
        580;


    cura.y =
        CHAO - 30;

}


function desenharCura() {

    if (
        !cura.ativa
    ) {

        return;

    }


    const tamanho =
        cura.tamanho +
        Math.sin(
            Date.now() *
            .008
        ) * 4;


    // brilho
    ctx.globalAlpha =
        .18;


    ctx.beginPath();

    ctx.arc(
        cura.x,
        cura.y,
        tamanho + 15,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#35ff68";

    ctx.fill();


    ctx.globalAlpha =
        1;


    // círculo
    ctx.beginPath();

    ctx.arc(
        cura.x,
        cura.y,
        tamanho,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#27ca50";

    ctx.fill();


    ctx.strokeStyle =
        "#dbffe3";

    ctx.lineWidth =
        3;

    ctx.stroke();


    // cruz
    ctx.fillStyle =
        "#fff";


    ctx.fillRect(
        cura.x - 5,
        cura.y - 14,
        10,
        28
    );


    ctx.fillRect(
        cura.x - 14,
        cura.y - 5,
        28,
        10
    );


    ctx.fillStyle =
        "#8dff9e";

    ctx.font =
        "bold 14px Arial";

    ctx.textAlign =
        "center";


    ctx.fillText(
        "CURA",
        cura.x,
        cura.y - 38
    );

}


// ======================================================
// VENCER ANDAR
// ======================================================

function vencerAndar() {

    esperando =
        true;


    const recompensa =
        150 +
        andar * 80;


    ganharMoedas(
        recompensa
    );


    ganharXP(
        500 +
        andar * 100
    );


    pontos +=
        600;


    // BOSS FINAL
    if (
        andar >=
        dadosAndares.length
    ) {

        // inicia dança
        esperando =
            false;


        jogador.dancando =
            true;


        jogador.dancaTimer =
            360;


        criarParticulas(
            jogador.x + 25,
            jogador.y + 40,
            "#ffd94a",
            70
        );


        // fanfarra
        setTimeout(
            () => {
                beep(
                    600,
                    .15,
                    "sine",
                    .08
                );
            },
            100
        );


        setTimeout(
            () => {
                beep(
                    800,
                    .15,
                    "sine",
                    .08
                );
            },
            350
        );


        setTimeout(
            () => {
                beep(
                    1000,
                    .25,
                    "sine",
                    .08
                );
            },
            600
        );


        return;

    }


    // próximo andar
    setTimeout(
        () => {

            andar++;

            combo =
                0;


            jogador.vida =
                Math.min(
                    jogador.vidaMax,
                    jogador.vida +
                    200
                );


            jogador.energia =
                Math.min(
                    jogador.energiaMax,
                    jogador.energia +
                    40
                );


            criarInimigo();


            esperando =
                false;

        },
        1800
    );

}


// ======================================================
// FUNDO
// ======================================================

function desenharFundo() {

    const grad =
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    grad.addColorStop(
        0,
        "#181818"
    );


    grad.addColorStop(
        1,
        "#040404"
    );


    ctx.fillStyle =
        grad;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    // lua
    ctx.beginPath();


    ctx.arc(
        1000,
        100,
        55,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#dedede";


    ctx.fill();


    // montanhas
    ctx.fillStyle =
        "#101010";


    ctx.beginPath();

    ctx.moveTo(
        0,
        440
    );


    for (
        let x = 0;
        x <= W;
        x += 100
    ) {

        ctx.lineTo(
            x,
            370 +
            Math.sin(
                x * .025
            ) *
            60
        );

    }


    ctx.lineTo(
        W,
        H
    );


    ctx.lineTo(
        0,
        H
    );


    ctx.closePath();

    ctx.fill();


    // torre ao fundo
    ctx.fillStyle =
        "#0c0c0c";


    ctx.fillRect(
        55,
        170,
        180,
        405
    );


    for (
        let y = 185;
        y < 550;
        y += 48
    ) {

        ctx.fillStyle =
            "#232323";


        ctx.fillRect(
            40,
            y,
            210,
            18
        );

    }


    for (
        let y = 210;
        y < 530;
        y += 75
    ) {

        ctx.fillStyle =
            "#634a1b";


        ctx.fillRect(
            115,
            y,
            35,
            30
        );

    }


    // chão
    ctx.fillStyle =
        "#181818";


    ctx.fillRect(
        0,
        CHAO,
        W,
        H -
        CHAO
    );


    // piso
    ctx.strokeStyle =
        "#2b2b2b";


    ctx.lineWidth = 2;


    for (
        let x = 0;
        x < W;
        x += 60
    ) {

        ctx.beginPath();


        ctx.moveTo(
            x,
            CHAO
        );


        ctx.lineTo(
            x - 80,
            H
        );


        ctx.stroke();

    }


    // plataformas
    desenharPlataforma(
        390,
        450,
        180,
        18
    );


    desenharPlataforma(
        650,
        395,
        180,
        18
    );

}


function desenharPlataforma(
    x,
    y,
    largura,
    altura
) {

    ctx.fillStyle =
        "#303030";


    ctx.fillRect(
        x,
        y,
        largura,
        altura
    );


    ctx.strokeStyle =
        "#656565";


    ctx.lineWidth =
        2;


    ctx.strokeRect(
        x,
        y,
        largura,
        altura
    );

}


// ======================================================
// PERSONAGEM
// ======================================================

function desenharPersonagem(
    p,
    ehJogador
) {

    // Boss
    if (
        !ehJogador &&
        inimigo.boss
    ) {

        desenharJVGamero(
            p
        );

        return;

    }


    const skin =
        skins[
            ehJogador
                ? skinAtual
                : "vermelho"
        ];


    const roupa =
        ehJogador
            ? roupas[
                roupaAtual
            ]
            : {
                cor:
                    "#a8343c",

                acessorio:
                    "nenhum"
            };


    const x =
        p.x +
        p.largura / 2;


    const agachado =
        ehJogador &&
        p.agachado;


    ctx.beginPath();


    ctx.ellipse(
        x,
        CHAO + 5,
        40,
        11,
        0,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "rgba(0,0,0,.65)";


    ctx.fill();


    if (
        p.invulneravel >
        0 &&
        Math.floor(
            p.invulneravel / 3
        ) % 2 === 0
    ) {

        return;

    }


    // corpo
    const corpoY =
        agachado
            ? p.y + 40
            : p.y + 23;


    const corpoAltura =
        agachado
            ? 28
            : 46;


    // pernas
    ctx.strokeStyle =
        roupa.cor ||
        skin.corpo;


    ctx.lineWidth =
        agachado
            ? 13
            : 14;


    ctx.lineCap =
        "round";


    ctx.beginPath();


    ctx.moveTo(
        x - 11,
        corpoY + corpoAltura
    );


    ctx.lineTo(
        x - 20,
        corpoY +
        corpoAltura +
        25
    );


    ctx.moveTo(
        x + 11,
        corpoY + corpoAltura
    );


    ctx.lineTo(
        x + 20,
        corpoY +
        corpoAltura +
        25
    );


    ctx.stroke();


    // corpo
    ctx.fillStyle =
        roupa.cor ||
        skin.corpo;


    ctx.fillRect(
        x - 21,
        corpoY,
        42,
        corpoAltura
    );


    // detalhe da roupa
    ctx.fillStyle =
        skin.detalhe;


    ctx.fillRect(
        x - 21,
        corpoY + 30,
        42,
        8
    );


    // cabeça
    ctx.beginPath();


    ctx.arc(
        x,
        p.y + 8,
        24,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#c8916a";


    ctx.fill();


    // cabelo
    ctx.beginPath();


    ctx.arc(
        x,
        p.y + 3,
        24,
        Math.PI,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#1c1c1c";


    ctx.fill();


    // olhos
    ctx.fillStyle =
        "#111";


    ctx.fillRect(
        x - 10,
        p.y + 7,
        5,
        4
    );


    ctx.fillRect(
        x + 5,
        p.y + 7,
        5,
        4
    );


    // acessórios
    desenharAcessorio(
        x,
        p.y,
        roupa.acessorio
    );


    // braços
    ctx.strokeStyle =
        roupa.cor ||
        skin.corpo;


    ctx.lineWidth =
        13;


    ctx.beginPath();


    ctx.moveTo(
        x - 18,
        corpoY + 10
    );


    ctx.lineTo(
        x -
        38 *
        p.olhando,
        corpoY + 33
    );


    ctx.stroke();


    ctx.beginPath();


    ctx.moveTo(
        x + 18,
        corpoY + 10
    );


    if (
        p.atacando
    ) {

        ctx.lineTo(
            x +
            58 *
            p.olhando,
            corpoY + 10
        );

    }
    else {

        ctx.lineTo(
            x +
            35 *
            p.olhando,
            corpoY + 33
        );

    }


    ctx.stroke();


    // defesa
    if (
        ehJogador &&
        p.defendendo
    ) {

        ctx.strokeStyle =
            skin.efeito;


        ctx.lineWidth =
            5;


        ctx.beginPath();


        ctx.arc(
            x,
            corpoY + 30,
            62,
            -1.1,
            1.1
        );


        ctx.stroke();

    }


    // ataque
    if (
        p.atacando
    ) {

        ctx.strokeStyle =
            skin.efeito;


        ctx.lineWidth =
            4;


        ctx.beginPath();


        ctx.arc(
            x +
            45 *
            p.olhando,
            corpoY + 15,
            25,
            -1,
            1
        );


        ctx.stroke();

    }


    // dança
    if (
        ehJogador &&
        p.dancando
    ) {

        const movimento =
            Math.sin(
                Date.now() *
                .01
            );


        ctx.strokeStyle =
            skin.efeito;


        ctx.lineWidth =
            10;


        ctx.beginPath();


        ctx.moveTo(
            x - 15,
            corpoY + 25
        );


        ctx.lineTo(
            x - 50,
            corpoY +
            15 +
            movimento *
            15
        );


        ctx.moveTo(
            x + 15,
            corpoY + 25
        );


        ctx.lineTo(
            x + 50,
            corpoY -
            movimento *
            15
        );


        ctx.stroke();

    }

}

// ======================================================
// JV GAMERO
// ======================================================

function desenharJVGamero(
    p
) {

    const x =
        p.x +
        p.largura / 2;


    const y =
        p.y;


    // sombra
    ctx.beginPath();


    ctx.ellipse(
        x,
        CHAO + 5,
        72,
        15,
        0,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "rgba(0,0,0,.75)";


    ctx.fill();


    if (
        p.invulneravel >
        0 &&
        Math.floor(
            p.invulneravel / 3
        ) % 2 === 0
    ) {

        return;

    }


    // pernas grossas
    ctx.strokeStyle =
        "#754923";


    ctx.lineWidth =
        25;


    ctx.lineCap =
        "round";


    ctx.beginPath();


    ctx.moveTo(
        x - 30,
        y + 72
    );


    ctx.lineTo(
        x - 40,
        y + 98
    );


    ctx.moveTo(
        x + 30,
        y + 72
    );


    ctx.lineTo(
        x + 40,
        y + 98
    );


    ctx.stroke();


    // corpo grande
    ctx.beginPath();


    ctx.ellipse(
        x,
        y + 48,
        68,
        62,
        0,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#7e4e27";


    ctx.fill();


    // faixa de sumô
    ctx.fillStyle =
        "#dfc675";


    ctx.fillRect(
        x - 52,
        y + 58,
        104,
        20
    );


    // cabeça
    ctx.beginPath();


    ctx.arc(
        x,
        y - 3,
        30,
        0,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#ca936b";


    ctx.fill();


    // cabelo
    ctx.beginPath();


    ctx.arc(
        x,
        y - 12,
        29,
        Math.PI,
        Math.PI * 2
    );


    ctx.fillStyle =
        "#161616";


    ctx.fill();


    // olhos
    ctx.fillStyle =
        "#111";


    ctx.fillRect(
        x - 11,
        y - 2,
        6,
        4
    );


    ctx.fillRect(
        x + 5,
        y - 2,
        6,
        4
    );


    // braços
    ctx.strokeStyle =
        "#754923";


    ctx.lineWidth =
        24;


    ctx.beginPath();


    ctx.moveTo(
        x - 46,
        y + 34
    );


    ctx.lineTo(
        x - 80,
        y + 54
    );


    ctx.moveTo(
        x + 46,
        y + 34
    );


    ctx.lineTo(
        x + 80,
        y + 54
    );


    ctx.stroke();


    // ataque do boss
    if (
        p.atacando
    ) {

        ctx.strokeStyle =
            "#ffd75c";


        ctx.lineWidth =
            6;


        ctx.beginPath();


        ctx.arc(
            x +
            78 *
            p.olhando,
            y + 52,
            28,
            -1,
            1
        );


        ctx.stroke();

    }


    // nome
    ctx.fillStyle =
        "#ffd95a";


    ctx.font =
        "bold 20px Arial";


    ctx.textAlign =
        "center";


    ctx.fillText(
        "JV GAMERO",
        x,
        y - 55
    );

}


// ======================================================
// BARRAS
// ======================================================

function desenharBarra(
    x,
    y,
    largura,
    altura,
    valor,
    maximo,
    nome,
    especial = false
) {

    const pct =
        Math.max(
            0,
            valor /
            maximo
        );


    ctx.fillStyle =
        "#111";


    ctx.fillRect(
        x,
        y,
        largura,
        altura
    );


    ctx.fillStyle =
        especial
            ? "#35d9cf"
            : (
                pct >
                .5
                    ? "#38cc63"
                    : pct >
                      .25
                        ? "#dcb634"
                        : "#e24b4b"
            );


    ctx.fillRect(
        x,
        y,
        largura *
        pct,
        altura
    );


    ctx.strokeStyle =
        "#ddd";


    ctx.lineWidth =
        2;


    ctx.strokeRect(
        x,
        y,
        largura,
        altura
    );


    ctx.fillStyle =
        "#fff";


    ctx.font =
        "bold 17px Arial";


    ctx.textAlign =
        "left";


    ctx.fillText(
        nome,
        x,
        y - 9
    );


    ctx.font =
        "13px Arial";


    ctx.fillText(
        `${Math.ceil(valor)} / ${maximo}`,
        x,
        y +
        altura +
        18
    );

}

// ======================================================
// COMPRAR ROUPA
// ======================================================

function comprarOuEquiparRoupa(
    id
) {

    const roupa =
        roupas[id];


    if (
        roupasCompradas
        .includes(id)
    ) {

        roupaAtual =
            id;


        salvar();


        popup(
            `${roupa.nome} equipada`
        );


        return;

    }


    if (
        moedas <
        roupa.preco
    ) {

        popup(
            "Moedas insuficientes"
        );


        beep(
            100,
            .12,
            "square",
            .05
        );


        return;

    }


    moedas -=
        roupa.preco;


    roupasCompradas.push(
        id
    );


    roupaAtual =
        id;


    salvar();


    popup(
        `${roupa.nome} desbloqueada!`
    );


    beep(
        700,
        .15,
        "sine",
        .08
    );

}

// ======================================================
// RENDER
// ======================================================

function renderizar() {

    if (
        tela ===
        "menu"
    ) {

        desenharMenu();

    }

    else if (
        tela ===
        "loja"
    ) {

        desenharLoja();

    }

    else if (
        tela ===
        "personagem"
    ) {

        desenharPersonagemMenu();

    }

    else if (
        tela ===
        "inventario"
    ) {

        desenharInventario();

    }

    else if (
        tela ===
        "jogo"
    ) {

        desenharJogo();

    }


    desenharPopup();

}


// ======================================================
// LOOP
// ======================================================

function loop() {

    atualizarJogador();

    atualizarInimigo();

    atualizarCura();

    atualizarParticulas();

    renderizar();

    requestAnimationFrame(
        loop
    );

}

        iniciarAudio();


        const rect =
            canvas.getBoundingClientRect();


        const escalaX =
            W /
            rect.width;


        const escalaY =
            H /
            rect.height;


        const x =
            (
                e.clientX -
                rect.left
            ) *
            escalaX;


        const y =
            (
                e.clientY -
                rect.top
            ) *
            escalaY;


        if (
            tela ===
            "menu"
        ) {

            if (
                x >= 410 &&
                x <= 790 &&
                y >= 240 &&
                y <= 302
            ) {

                iniciarTorre();

            }


            else if (
                x >= 410 &&
                x <= 790 &&
                y >= 315 &&
                y <= 377
            ) {

                tela =
                    "loja";

            }


            else if (
                x >= 410 &&
                x <= 790 &&
                y >= 390 &&
                y <= 452
            ) {

                tela =
                    "personagem";

            }


            else if (
                x >= 410 &&
                x <= 790 &&
                y >= 465 &&
                y <= 527
            ) {

                tela =
                    "inventario";

            }

        }

    }
);


// ======================================================
// INICIAR
// ======================================================

configurarJogador();

criarInimigo();

loop();

</script>
