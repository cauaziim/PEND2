function clamp(valor,min,max){

    return Math.max(
        min,
        Math.min(max,valor)
    );

}

function distance(a,b){

/* =========================================================
   ÁUDIO
========================================================= */

let audioContext = null;

function startAudio(){

    if(!audioContext){

        audioContext =
            new (
                window.AudioContext ||
                window.webkitAudioContext
            )();

    }

    if(
        audioContext.state ===
        "suspended"
    ){

        audioContext.resume();

    }

}

function sound(
    frequency,
    duration,
    type="square",
    volume=.035
){

    startAudio();

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    oscillator.type =
        type;

    oscillator.frequency.value =
        frequency;

    gain.gain.setValueAtTime(
        volume,
        audioContext.currentTime
    );

    gain.gain.exponentialRampToValueAtTime(
        .001,
        audioContext.currentTime +
        duration
    );

    oscillator.connect(gain);

    gain.connect(
        audioContext.destination
    );

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime +
        duration
    );

}

const heal = {

    active:false,

    x:0,

    y:GROUND-35,

    timer:600

};


function spawnHeal(){

    heal.active=true;

    heal.x=
        random(
            330,
            870
        );

}


function updateHeal(){

    if(
        screen!=="game" ||
        gameOver ||
        waitingNext ||
        victoryDance
    ){

        return;

    }


    if(
        !heal.active
    ){

        heal.timer--;

        if(
            heal.timer<=0
        ){

            spawnHeal();

        }

        return;

    }


    heal.y=
        GROUND-
        35+
        Math.sin(
            Date.now()*.007
        )*6;


    if(
        distance(
            player.x+28,
            heal.x
        )<52 &&
        distance(
            player.y+48,
            heal.y
        )<70
    ){

        if(
            player.hp<
            player.maxHp
        ){

            let amount=250;


            if(
                mode==="challenge" &&
                eventType==="doubleHeal"
            ){

                amount*=2;

            }


            const before =
                player.hp;


            player.hp=
                Math.min(
                    player.maxHp,
                    player.hp+amount
                );


            const recovered =
                player.hp-before;


            popup(
                `💚 +${recovered} HP`
            );


            createParticles(
                heal.x,
                heal.y,
                "#4eff73",
                30
            );


            sound(
                720,
                .15,
                "sine",
                .08
            );


            heal.active=false;

            heal.timer=600;

        }

    }

}


function drawHeal(){

    if(
        !heal.active
    ){

        return;

    }


    const pulse=
        Math.sin(
            Date.now()*.008
        )*4;


    ctx.globalAlpha=.18;


    ctx.beginPath();

    ctx.arc(
        heal.x,
        heal.y,
        44+pulse,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#42ff6c";

    ctx.fill();


    ctx.globalAlpha=1;


    ctx.beginPath();

    ctx.arc(
        heal.x,
        heal.y,
        24+pulse/2,
        0,
        Math.PI*2
    );

    ctx.fillStyle="#2acb51";

    ctx.fill();


    ctx.strokeStyle="#dffff0";

    ctx.lineWidth=3;

    ctx.stroke();


    ctx.fillStyle="#fff";

    ctx.fillRect(
        heal.x-5,
        heal.y-15,
        10,
        30
    );

    ctx.fillRect(
        heal.x-15,
        heal.y-5,
        30,
        10
    );


    ctx.fillStyle="#91ff9d";

    ctx.font="bold 13px Arial";

    ctx.textAlign="center";

    ctx.fillText(
        "CURA",
        heal.x,
        heal.y-43
    );

}

/* =========================================================
   PARTÍCULAS
========================================================= */

let particles=[];


function createParticles(
    x,
    y,
    color,
    amount=10
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        particles.push({

            x:x,

            y:y,

            vx:
                random(-4.5,4.5),

            vy:
                random(-9,-1),

            gravity:.35,

            life:
                random(25,60),

            size:
                random(2,5),

            color:color

        });

    }

}


function updateParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];


        p.x+=p.vx;

        p.y+=p.vy;

        p.vy+=p.gravity;

        p.life--;


        if(
            p.life<=0
        ){

            particles.splice(
                i,
                1
            );

        }

    }

}


function drawParticles(){

    particles.forEach(
        p=>{

            ctx.globalAlpha=
                Math.max(
                    0,
                    p.life/60
                );


            ctx.fillStyle=
                p.color;


            ctx.fillRect(
                p.x,
                p.y,
                p.size,
                p.size
            );

        }
    );


    ctx.globalAlpha=1;

}

}

        claimedMissions

        mission.value()<

    claimedMissions.push(
        index

    addCoins(
        mission.reward
    );


    addXP(
        600

    saveGame();


    popup(

/* =========================================================
   UPDATE PLAYER
========================================================= */

function updatePlayer(){

    if(
        screen!=="game" ||
        gameOver
    ){

        return;

    }


    /* DANÇA FINAL */

    if(
        victoryDance
    ){

        player.danceTimer--;


        player.x=
            600+
            Math.sin(
                Date.now()*.008
            )*100;


        player.y=
            GROUND-
            player.height-
            Math.abs(
                Math.sin(
                    Date.now()*.012
                )
            )*30;


        player.dancing=true;


        if(
            Math.random()<.22
        ){

            const color=
                currentEffect!=="nenhum"
                    ? effects[
                        currentEffect
                    ].color
                    : "#ffd950";


            createParticles(
                player.x+28,
                player.y+25,
                color,
                4
            );

        }


        if(
            player.danceTimer<=0
        ){

            victoryDance=false;

            gameOver=true;

        }


        return;

    }


    if(
        waitingNext
    ){

        return;

    }


    let speed=
        characters[
            currentCharacter
        ].speed;


    if(
        mode==="challenge" &&
        eventType==="fast"
    ){

        speed+=2;

    }


    player.vx=0;


    player.crouching=
        !!keys["s"] &&
        !player.attacking;


    player.defending=
        !!keys["l"] &&
        !player.attacking &&
        !player.crouching;


    if(
        !player.defending
    ){

        if(
            keys["a"]
        ){

            player.vx=-speed;
            player.direction=-1;

        }


        if(
            keys["d"]
        ){

            player.vx=speed;
            player.direction=1;

        }

    }


    /* PULO */

    if(
        keys["w"] &&
        player.onGround &&
        !player.crouching &&
        !player.defending
    ){

        player.vy=-15;

        player.onGround=false;

        keys["w"]=false;

    }


    /* DASH */

    if(
        keys["shift"] &&
        player.dashCooldown<=0 &&
        !player.defending &&
        !player.crouching
    ){

        player.x+=
            player.direction*
            95;


        player.dashCooldown=40;

        player.invulnerable=15;


        createParticles(
            player.x,
            player.y+55,
            skins[
                currentSkin
            ].effect,
            16
        );


        sound(
            430,
            .08,
            "sawtooth",
            .04
        );


        keys["shift"]=false;

    }


    if(
        player.dashCooldown>0
    ){

        player.dashCooldown--;

    }


    /* ATAQUES */

    if(
        !player.attacking &&
        !player.defending &&
        !player.crouching
    ){

        if(
            keys["j"]
        ){

            startAttack("punch");
            keys["j"]=false;

        }

        else if(
            keys["k"]
        ){

            startAttack("kick");
            keys["k"]=false;

        }

        else if(
            keys["e"]
        ){

            if(
                player.energy>=100
            ){

                startSpecial();

            }
            else{

                popup(
                    `Energia: ${Math.floor(player.energy)}%`
                );

            }

            keys["e"]=false;

        }

    }


    /* FÍSICA */

    player.x+=
        player.vx;


    player.vy+=.68;

    player.y+=
        player.vy;


    if(
        player.y>=
        GROUND-
        player.height
    ){

        player.y=
            GROUND-
            player.height;

        player.vy=0;

        player.onGround=true;

    }


    player.x=
        clamp(
            player.x,
            220,
            970
        );


    /* ENERGIA */

    let gain=
        characters[
            currentCharacter
        ].energy;


    if(
        mode==="challenge" &&
        eventType==="doubleEnergy"
    ){

        gain*=2;

    }


    player.energy=
        clamp(
            player.energy+
            gain,
            0,
            100
        );


    /* DEFESA */

    if(
        player.defending
    ){

        player.defense-=.3;

    }
    else{

        player.defense+=.15;

    }


    player.defense=
        clamp(
            player.defense,
            0,
            player.maxDefense
        );


    /* ATAQUE TIMER */

    if(
        player.attackTimer>0
    ){

        player.attackTimer--;


        if(
            player.attackTimer===10
        ){

            checkAttack();

        }

    }
    else{

        player.attacking=false;

        player.attackType="";

    }


    if(
        player.invulnerable>0
    ){

        player.invulnerable--;

    }

}


/* =========================================================
   CHECK ATTACK
========================================================= */

function checkAttack(){

    const distanceX=
        distance(
            player.x+28,
            enemy.x+28
        );


    let range=88;

    let damage=100;


    if(
        player.attackType==="kick"
    ){

        range=112;

    }


    if(
        player.attackType==="special"
    ){

        range=175;

        damage=500;

    }


    damage+=
        Math.floor(
            combo*.5
        );


    /* crítico */

    if(
        player.attackType!=="special" &&
        Math.random()<.06
    ){

        damage*=2;

        popup(
            "💥 CRÍTICO!"
        );

    }


    if(
        distanceX>range
    ){

        return;

    }


    if(
        enemy.invulnerable>0
    ){

        return;

    }


    enemy.hp-=
        damage;


    enemy.invulnerable=10;


    enemy.x+=
        player.direction*
        (
            enemy.boss
                ? 8
                : 26
        );


    combo++;

    maxCombo=
        Math.max(
            maxCombo,
            combo
        );


    points+=
        damage*5;


    if(
        mode==="challenge"
    ){

        challengeProgress++;

    }


    createParticles(
        enemy.x+28,
        enemy.y+40,
        damage>=500
            ? "#ffe25d"
            : skins[
                currentSkin
            ].detail,
        damage>=500
            ? 40
            : 12
    );


    screenShake=
        damage>=500
            ? 14
            : 4;


    screenFlash=
        damage>=500
            ? 8
            : 2;


    sound(
        damage>=500
            ? 55
            : 80,
        .11,
        "triangle",
        .07
    );


    /* BOSS FASES */

    if(
        enemy.boss &&
        enemy.hp<=3000 &&
        enemy.phase===1
    ){

        enemy.phase=2;

        dialogue=
            "Agora ficou sério!";

        dialogueTimer=150;

        popup(
            "JV GAMERO entrou na FASE 2!"
        );

    }


    if(
        enemy.boss &&
        enemy.hp<=1000 &&
        enemy.phase===2
    ){

        enemy.phase=3;

        dialogue=
            "EU AINDA NÃO TERMINEI!";

        dialogueTimer=150;

        popup(
            "JV GAMERO entrou na FASE FINAL!"
        );

        screenShake=20;

    }


    if(
        enemy.hp<=0
    ){

        enemy.hp=0;

        defeatEnemy();

    }

}


/* =========================================================
   UPDATE ENEMY
========================================================= */

function updateEnemy(){

    if(
        screen!=="game" ||
        gameOver ||
        waitingNext ||
        victoryDance
    ){

        return;

    }


    const dx=
        (
            player.x+28
        )-
        (
            enemy.x+28
        );


    const distanceX=
        Math.abs(dx);


    enemy.direction=
        dx>=0
            ? 1
            : -1;


    let speed=
        enemy.speed;


    if(
        enemy.boss
    ){

        if(
            enemy.hp<=3000
        ){

            speed+=.45;

        }

        if(
            enemy.hp<=1000
        ){

            speed+=.75;

        }

    }


    /* Ninja */

    if(
        enemy.type==="fast" &&
        Math.random()<.003
    ){

        enemy.x+=
            enemy.direction*
            100;

        enemy.invulnerable=10;

    }


    /* aproximação */

    if(
        distanceX>
        (
            enemy.boss
                ? 115
                : 90
        )
    ){

        enemy.x+=
            enemy.direction*
            speed;

    }


    /* cooldown */

    if(
        enemy.attackCooldown>0
    ){

        enemy.attackCooldown--;

    }


    const range=
        enemy.boss
            ? 150
            : 100;


    if(
        distanceX<=range &&
        enemy.attackCooldown<=0 &&
        !enemy.attacking
    ){

        enemy.attacking=true;

        enemy.attackTimer=
            enemy.boss
                ? 30
                : 25;


        enemy.attackCooldown=
            enemy.boss
                ? 45+
                  random(0,50)
                : 55+
                  random(0,75);


        if(
            enemy.boss
        ){

            createParticles(
                enemy.x+28,
                enemy.y+80,
                "#ffd85a",
                12
            );

        }

    }


    if(
        enemy.attacking
    ){

        enemy.attackTimer--;


        if(
            enemy.attackTimer===11
        ){

            enemyAttack();

        }


        if(
            enemy.attackTimer<=0
        ){

            enemy.attacking=false;

        }

    }


    if(
        enemy.invulnerable>0
    ){

        enemy.invulnerable--;

    }


    enemy.x=
        clamp(
            enemy.x,
            220,
            980
        );

}


/* =========================================================
   ENEMY ATTACK
========================================================= */

function enemyAttack(){

    const distanceX=
        distance(
            player.x+28,
            enemy.x+28
        );


    const range=
        enemy.boss
            ? 150
            : 100;


    if(
        distanceX>range
    ){

        return;

    }


    if(
        player.invulnerable>0
    ){

        return;

    }


    /* DEFESA */

    if(
        player.defending &&
        player.defense>0
    ){

        player.defense-=
            enemy.boss
                ? 20
                : 12;


        createParticles(
            player.x+28,
            player.y+42,
            "#ffffff",
            9
        );


        popup(
            "🛡️ BLOQUEADO!"
        );


        sound(
            340,
            .08,
            "square",
            .06
        );


        return;

    }


    /* AGACHAR */

    if(
        player.crouching &&
        !enemy.boss
    ){

        popup(
            "ESQUIVOU!"
        );


        createParticles(
            player.x+28,
            player.y+42,
            "#ffffff",
            5
        );


        return;

    }


    let damage=
        enemy.damage;


    if(
        enemy.boss
    ){

        if(
            enemy.phase===2
        ){

            damage+=6;

        }

        if(
            enemy.phase===3
        ){

            damage+=12;

        }

    }


    player.hp-=
        damage;


    player.invulnerable=22;


    combo=0;


    player.x-=
        enemy.direction*22;


    createParticles(
        player.x+28,
        player.y+42,
        "#ff7171",
        10
    );


    screenShake=6;


    sound(
        55,
        .12,
        "triangle",
        .07
    );


    if(
        player.hp<=0
    ){

        player.hp=0;

        gameOver=true;

    }

}

/* =========================================================
   DERROTAR
========================================================= */

function defeatEnemy(){

    waitingNext=true;


    let reward=
        150+
        floor*60;


    if(
        mode==="survival"
    ){

        reward=
            60+
            survivalWave*15;

    }


    if(
        mode==="challenge" &&
        eventType==="doubleCoins"
    ){

        reward*=2;

    }


    /* BOSS PRINCIPAL */

    if(
        mode==="tower" &&
        floor===10
    ){

        totalWins++;

        towersCompleted++;


        unlockedFloors=
            Math.max(
                unlockedFloors,
                11
            );


        newGamePlusUnlocked=true;


        record=
            Math.max(
                record,
                points
            );


        addCoins(
            5000
        );


        addXP(
            2500
        );


        points+=5000;


        waitingNext=false;


        victoryDance=true;


        player.dancing=true;

        player.danceTimer=420;


        createParticles(
            player.x+28,
            player.y+40,
            "#ffd84e",
            100
        );


        saveGame();


        victorySound();


        return;

    }


    /* ANDAR SECRETO */

    if(
        mode==="tower" &&
        floor===11
    ){

        totalWins++;


        reward=10000;


        addCoins(
            reward
        );


        addXP(
            5000
        );


        points+=10000;


        record=
            Math.max(
                record,
                points
            );


        waitingNext=false;


        victoryDance=true;


        player.dancing=true;

        player.danceTimer=500;


        createParticles(
            player.x+28,
            player.y+40,
            "#d45cff",
            120
        );


        victorySound();


        saveGame();


        return;

    }


    /* normal */

    addCoins(
        reward
    );


    addXP(
        350+
        floor*90
    );


    if(
        floor%3===0 &&
        mode==="tower"
    ){

        chestAvailable=true;


        popup(
            "🎁 BAÚ DESBLOQUEADO!"
        );

    }


    /* sobrevivência */

    if(
        mode==="survival"
    ){

        setTimeout(
            ()=>{

                waitingNext=false;

                createSurvivalEnemy();

            },
            1100
        );


        return;

    }


    /* treino */

    if(
        mode==="training"
    ){

        setTimeout(
            ()=>{

                waitingNext=false;

                createEnemy();

            },
            700
        );


        return;

    }


    /* torre/desafio */

    setTimeout(
        ()=>{

            floor++;


            if(
                floor>10 &&
                mode==="challenge"
            ){

                floor=1;

            }


            combo=0;


            player.hp=
                Math.min(
                    1000,
                    player.hp+200
                );


            createEnemy();


            waitingNext=false;

        },
        1300
    );

}

function startNewGamePlus(){

    if(
        !newGamePlusUnlocked
    ){

        popup(
            "Complete a Torre primeiro!"
        );

        return;

    }


    ngPlusRun=true;


    mode="tower";

    floor=1;


    points=0;

    combo=0;

    maxCombo=0;


    waitingNext=false;

    gameOver=false;

    victoryDance=false;


    screen="game";


    createEnemy();


    popup(
        "🔥 NEW GAME+!"
    );

}

function drawButton(
    x,
    y,
    width,
    height,
    text,
    color
){

    ctx.fillStyle=
        color;

    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    ctx.strokeStyle=
        "#fff";

    ctx.lineWidth=2;


    ctx.strokeRect(
        x,
        y,
        width,
        height
    );


    ctx.fillStyle=
        "#fff";

    ctx.font=
        "bold 20px Arial";

    ctx.textAlign=
        "center";


    ctx.fillText(
        text,
        x+width/2,
        y+height/2+7
    );

}

/* =========================================================
   TORRE HUD
========================================================= */

function drawTowerHUD(){

    const x=1040;

    const y=160;


    ctx.fillStyle="#101010";


    ctx.fillRect(
        x,
        y,
        165,
        440
    );


    for(
        let i=1;
        i<=11;
        i++
    ){

        const py=
            y+
            400-
            (i-1)*38;


        let color="#3a3a3a";


        if(
            i<floor
        ){

            color="#4085ff";

        }


        if(
            i===floor
        ){

            color="#e8c94d";

        }


        if(
            i===11 &&
            i<floor
        ){

            color="#d45cff";

        }


        ctx.fillStyle=color;


        ctx.fillRect(
            x-8,
            py,
            180,
            16
        );


        ctx.fillStyle="#fff";


        ctx.font="bold 10px Arial";

        ctx.textAlign="center";


        ctx.fillText(
            i===10
                ? "BOSS"
                : i===11
                    ? "SECRETO"
                    : `A${i}`,
            x+82,
            py+11
        );

    }

}


/* =========================================================
   HUD
========================================================= */

function drawBar(
    x,
    y,
    width,
    height,
    value,
    max,
    color,
    label
){

    const pct=
        clamp(
            value/max,
            0,
            1
        );


    ctx.fillStyle="#111";


    ctx.fillRect(
        x,
        y,
        width,
        height
    );


    ctx.fillStyle=color;


    ctx.fillRect(
        x,
        y,
        width*pct,
        height
    );


    ctx.strokeStyle="#ddd";


    ctx.lineWidth=2;


    ctx.strokeRect(
        x,
        y,
        width,
        height
    );


    ctx.fillStyle="#fff";

    ctx.font="bold 15px Arial";

    ctx.textAlign="left";


    ctx.fillText(
        label,
        x,
        y-8
    );


    ctx.font="12px Arial";


    ctx.fillText(
        `${Math.ceil(value)} / ${max}`,
        x,
        y+height+16
    );

}

   FUNDO
========================================================= */

function drawBackground(
    arena="city"
){

    let top="#171717";

    let bottom="#040404";


    if(
        arena==="forest"
    ){

        top="#102417";

        bottom="#061008";

    }


    if(
        arena==="ice"
    ){

        top="#102532";

        bottom="#071117";

    }


    if(
        arena==="volcano"
    ){

        top="#32140d";

        bottom="#090202";

    }


    if(
        arena==="boss"
    ){

        top="#32100b";

        bottom="#070101";

    }


    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );


    gradient.addColorStop(
        0,
        top
    );


    gradient.addColorStop(
        1,
        bottom
    );


    ctx.fillStyle=
        gradient;


    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    /* ESTRELAS */

    ctx.fillStyle="#fff";


    for(
        let i=0;
        i<45;
        i++
    ){

        const x=
            (i*97)%W;


        const y=
            35+
            (i*51)%280;


        ctx.globalAlpha=
            .25+
            (
                Math.sin(
                    Date.now()*.001+i
                )+1
            )*.15;


        ctx.fillRect(
            x,
            y,
            i%5===0?2:1,
            i%5===0?2:1
        );

    }


    ctx.globalAlpha=1;


    /* LUA */

    ctx.beginPath();


    ctx.arc(
        1050,
        95,
        62,
        0,
        Math.PI*2
    );


    ctx.fillStyle="#e3e3e3";


    ctx.fill();


    /* cenário */

    if(
        arena==="city"
    ){

        drawCity();

    }

    if(
        arena==="forest"
    ){

        drawForest();

    }

    if(
        arena==="ice"
    ){

        drawIce();

    }

    if(
        arena==="volcano" ||
        arena==="boss"
    ){

        drawVolcano();

    }


    /* chão */

    ctx.fillStyle="#151515";


    ctx.fillRect(
        0,
        GROUND,
        W,
        H-GROUND
    );


    ctx.strokeStyle="#292929";

    ctx.lineWidth=2;


    for(
        let x=0;
        x<W;
        x+=65
    ){

        ctx.beginPath();


        ctx.moveTo(
            x,
            GROUND
        );


        ctx.lineTo(
            x-100,
            H
        );


        ctx.stroke();

    }


    /* plataformas */

    drawPlatform(
        425,
        470,
        185,
        18
    );


    drawPlatform(
        700,
        405,
        180,
        18
    );

}


function drawCity(){

    ctx.fillStyle="#0c0c0c";


    for(
        let i=0;
        i<12;
        i++
    ){

        const height=
            120+
            (
                i*83
            )%230;


        ctx.fillRect(
            i*110,
            500-height,
            86,
            height
        );


        ctx.fillStyle="#2a2a2a";


        for(
            let y=350;
            y<500;
            y+=34
        ){

            ctx.fillRect(
                i*110+15,
                y,
                12,
                8
            );


            ctx.fillRect(
                i*110+40,
                y,
                12,
                8
            );

        }


        ctx.fillStyle="#0c0c0c";

    }


    ctx.fillStyle="#080808";


    ctx.fillRect(
        55,
        165,
        190,
        425
    );


    for(
        let y=180;
        y<580;
        y+=45
    ){

        ctx.fillStyle="#292929";


        ctx.fillRect(
            38,
            y,
            225,
            16
        );

    }

}


function drawForest(){

    ctx.fillStyle="#09150c";


    for(
        let i=0;
        i<11;
        i++
    ){

        const x=i*125;


        ctx.fillRect(
            x,

        );

        ctx.arc(

            280,
            83,
            0,
            Math.PI*2
        );


        ctx.fill();

    }

}


function drawIce(){

    ctx.fillStyle=
        "rgba(210,245,255,.09)";


    for(
        let i=0;
        i<35;
        i++
    ){

        ctx.beginPath();


        ctx.arc(
            (i*143)%W,
            160+
            (i*73)%310,
            3,
            0,
            Math.PI*2
        );


        ctx.fill();

    }


    ctx.fillStyle="#1a2b33";


    for(
        let i=0;
        i<8;
        i++
    ){

        ctx.beginPath();


        ctx.moveTo(
            i*170,

        );

        );

        );

function drawVolcano(){

    ctx.fillStyle="#24100b";


    ctx.beginPath();


    ctx.moveTo(
        0,
        470
    );


    for(
        let x=0;
        x<=W;
        x+=80
    ){

        ctx.lineTo(
            x,
            350+
            Math.sin(
                x*.03
            )*75
        );

    }


    ctx.lineTo(
        W,
        H
    );


    ctx.lineTo(
        0,
        H
    );


    ctx.closePath();


    ctx.fill();


    ctx.fillStyle="#ff6e3a";

    ctx.globalAlpha=.13;


    ctx.fillRect(
        0,
        450,
        W,
        25
    );

function drawPlatform(
    x,
    y,
    width,
    height
){

    ctx.fillStyle="#373737";


    ctx.fillRect(
        x,
        y,
        width,
        height
    );

    ctx.lineWidth=2;


    ctx.strokeRect(
        x,
        y,
        width,
        height
    );

}


/* =========================================================
   PERSONAGEM
========================================================= */

function drawFighter(
    fighter,
    isPlayer
){

    if(
        !isPlayer &&
        enemy.boss
    ){

        drawBoss(
            fighter
        );

        return;

    }


    const skin=
        skins[
            isPlayer
                ? currentSkin
                : "vermelho"
        ];


    const outfit=
        isPlayer
            ? outfits[
                currentOutfit
            ]
            : {
                color:"#a53b43",
                accessory:"none"
            };


    const x=
        fighter.x+
        fighter.width/2;


    const crouch=
        isPlayer &&
        fighter.crouching;


    const bodyY=
        crouch
            ? fighter.y+48
            : fighter.y+24;


    const bodyHeight=
        crouch
            ? 27
            : 48;


    /* aura */

    if(
        isPlayer &&
        currentEffect!=="nenhum"
    ){

        const effect=
            effects[
                currentEffect
            ];


        ctx.globalAlpha=.12;


        ctx.beginPath();


        ctx.arc(
            x,
            bodyY+25,
            62+
            Math.sin(
                Date.now()*.008
            )*6,
            0,
            Math.PI*2
        );


        ctx.fillStyle=
            effect.color;


        ctx.fill();


        ctx.globalAlpha=1;

    }


    /* sombra */

    ctx.beginPath();


    ctx.ellipse(
        x,
        GROUND+6,
        42,
        11,
        0,
        0,
        Math.PI*2
    );


    ctx.fillStyle=
        "rgba(0,0,0,.65)";


    ctx.fill();


    if(
        fighter.invulnerable>0 &&
        Math.floor(
            fighter.invulnerable/3
        )%2===0
    ){

        return;

    }


    /* pernas */

    ctx.strokeStyle=
        outfit.color ||
        skin.body;


    ctx.lineWidth=
        crouch
            ? 13
            : 15;


    ctx.lineCap="round";


    ctx.beginPath();


    ctx.moveTo(
        x-11,
        bodyY+bodyHeight
    );


    ctx.lineTo(
        x-21,
        bodyY+
        bodyHeight+
        27
    );


    ctx.moveTo(
        x+11,
        bodyY+bodyHeight
    );


    ctx.lineTo(
        x+21,
        bodyY+
        bodyHeight+
        27
    );


    ctx.stroke();


    /* corpo */

    ctx.fillStyle=
        outfit.color ||
        skin.body;


    ctx.fillRect(
        x-23,
        bodyY,
        46,
        bodyHeight
    );


    ctx.fillStyle=
        skin.detail;


    ctx.fillRect(
        x-23,
        bodyY+31,
        46,
        8
    );


    /* cabeça */

    ctx.beginPath();


    ctx.arc(
        x,
        fighter.y+7,
        25,
        0,
        Math.PI*2
    );


    ctx.fillStyle="#cb946c";


    ctx.fill();


    /* cabelo */

    ctx.beginPath();


    ctx.arc(
        x,
        fighter.y+1,
        25,
        Math.PI,
        Math.PI*2
    );


    ctx.fillStyle="#1c1c1c";


    ctx.fill();


    /* olhos */

    ctx.fillStyle="#111";


    ctx.fillRect(
        x-10,
        fighter.y+7,
        5,
        4
    );


    ctx.fillRect(
        x+5,
        fighter.y+7,
        5,
        4
    );


    drawAccessory(
        x,
        fighter.y,
        outfit.accessory
    );


    /* braço traseiro */

    ctx.strokeStyle=
        outfit.color ||
        skin.body;


    ctx.lineWidth=13;


    ctx.beginPath();


    ctx.moveTo(
        x-18,
        bodyY+10
    );


    ctx.lineTo(
        x-
        38*
        fighter.direction,
        bodyY+34
    );


    ctx.stroke();


    /* braço frontal */

    ctx.beginPath();


    ctx.moveTo(
        x+18,
        bodyY+10
    );


    if(
        fighter.attacking
    ){

        ctx.lineTo(
            x+
            (
                fighter.attackType==="special"
                    ? 78
                    : 60
            )*
            fighter.direction,
            bodyY+
            (
                fighter.attackType==="special"
                    ? -5
                    : 10
            )
        );

    }
    else{

        ctx.lineTo(
            x+
            35*
            fighter.direction,
            bodyY+34
        );

    }


    ctx.stroke();


    /* defesa */

    if(
        isPlayer &&
        fighter.defending
    ){

        ctx.strokeStyle=
            "#fff";


        ctx.lineWidth=5;


        ctx.beginPath();


        ctx.arc(
            x,
            bodyY+30,
            67,
            -1.1,
            1.1
        );


        ctx.stroke();

    }


    /* ataque */

    if(
        fighter.attacking
    ){

        ctx.strokeStyle=
            fighter.attackType==="special"
                ? "#ffe56d"
                : skin.detail;


        ctx.lineWidth=
            fighter.attackType==="special"
                ? 8
                : 4;


        ctx.beginPath();


        ctx.arc(
            x+
            50*
            fighter.direction,
            bodyY+15,
            fighter.attackType==="special"
                ? 40
                : 25,
            -1,
            1
        );


        ctx.stroke();

    }


    /* dança */

    if(
        isPlayer &&
        fighter.dancing
    ){

        const move=
            Math.sin(
                Date.now()*.012
            );


        const color=
            currentEffect!=="nenhum"
                ? effects[
                    currentEffect
                ].color
                : skin.detail;


        ctx.strokeStyle=
            color;


        ctx.lineWidth=10;


        ctx.beginPath();


        ctx.moveTo(
            x-15,
            bodyY+24
        );


        ctx.lineTo(
            x-55,
            bodyY+
            15+
            move*18
        );


        ctx.moveTo(
            x+15,
            bodyY+24
        );


        ctx.lineTo(
            x+55,
            bodyY-
            move*18
        );


        ctx.stroke();

    }

}

/* =========================================================
   BOSS
========================================================= */

function drawBoss(p){

    const x=
        p.x+
        p.width/2;


    const y=
        p.y;


    if(
        enemy.phase>=2
    ){

        ctx.globalAlpha=.14;


        ctx.beginPath();


        ctx.arc(
            x,
            y+48,
            enemy.phase===3
                ? 118
                : 95,
            0,
            Math.PI*2
        );


        ctx.fillStyle=
            enemy.phase===3
                ? "#ff5a45"
                : "#ffb54c";


        ctx.fill();


        ctx.globalAlpha=1;

    }


    ctx.beginPath();


    ctx.ellipse(
        x,
        GROUND+7,
        82,
        18,
        0,
        0,
        Math.PI*2
    );


    ctx.fillStyle=
        "rgba(0,0,0,.78)";


    ctx.fill();


    if(
        p.invulnerable>0 &&
        Math.floor(
            p.invulnerable/3
        )%2===0
    ){

        return;

    }


    /* pernas */

    ctx.strokeStyle="#724720";

    ctx.lineWidth=30;

    ctx.lineCap="round";


    ctx.beginPath();


    ctx.moveTo(
        x-32,
        y+77
    );


    ctx.lineTo(
        x-42,
        y+108
    );


    ctx.moveTo(
        x+32,
        y+77
    );


    ctx.lineTo(
        x+42,
        y+108
    );


    ctx.stroke();


    /* corpo */

    ctx.beginPath();


    ctx.ellipse(
        x,
        y+48,
        75,
        71,
        0,
        0,
        Math.PI*2
    );


    ctx.fillStyle="#7f4e27";


    ctx.fill();


    /* faixa */

    ctx.fillStyle="#e1c977";


    ctx.fillRect(
        x-58,
        y+60,
        116,
        24
    );


    /* cabeça */

    ctx.beginPath();


    ctx.arc(
        x,
        y-5,
        33,
        0,
        Math.PI*2
    );


    ctx.fillStyle="#cb946d";


    ctx.fill();


    /* cabelo */

    ctx.beginPath();


    ctx.arc(
        x,
        y-15,
        31,
        Math.PI,
        Math.PI*2
    );


    ctx.fillStyle="#151515";


    ctx.fill();


    /* olhos */

    ctx.fillStyle="#111";


    ctx.fillRect(
        x-12,
        y-1,
        6,
        4
    );


    ctx.fillRect(
        x+6,
        y-1,
        6,
        4
    );


    /* braços */

    ctx.strokeStyle="#724720";

    ctx.lineWidth=27;


    ctx.beginPath();


    ctx.moveTo(
        x-50,
        y+35
    );


    ctx.lineTo(
        x-88,
        y+58
    );


    ctx.moveTo(
        x+50,
        y+35
    );


    ctx.lineTo(
        x+88,
        y+58
    );


    ctx.stroke();


    if(
        p.attacking
    ){

        ctx.strokeStyle="#ffdc60";

        ctx.lineWidth=8;


        ctx.beginPath();


        ctx.arc(
            x+
            88*
            p.direction,
            y+58,
            35,
            -1,
            1
        );


        ctx.stroke();

    }


    ctx.fillStyle="#ffdc5b";

    ctx.font="bold 23px Arial";

    ctx.textAlign="center";


    ctx.fillText(
        enemy.name,
        x,
        y-68
    );


    ctx.fillStyle=
        enemy.phase===3
            ? "#ff5948"
            : "#ffdb5c";


    ctx.font="bold 15px Arial";


    ctx.fillText(
        `FASE ${enemy.phase}`,
        x,
        y-47
    );

}

/* =========================================================
   CONTROLES
========================================================= */

const keys={};


document.addEventListener(
    "keydown",
    event=>{

        const key=
            event.key.toLowerCase();


        keys[key]=true;


        startAudio();


        if([
            "a",
            "d",
            "w",
            "s",
            "j",
            "k",
            "l",
            "e",
            "q",
            "shift",
            "escape",
            "enter",
            "n"
        ].includes(key)){

            event.preventDefault();

        }


        handleNavigation(key);

    }
);


document.addEventListener(
    "keyup",
    event=>{

        keys[
            event.key.toLowerCase()
        ]=false;

    }
);


/* =========================================================
   NAVEGAÇÃO
========================================================= */

function handleNavigation(
    key
){

    if(
        key==="escape"
    ){

        screen="menu";

        gameOver=false;

        waitingNext=false;

        victoryDance=false;

        player.dancing=false;

        return;

    }


    /* FINAL */

    if(
        gameOver &&
        key==="enter"
    ){

        screen="menu";

        gameOver=false;

        victoryDance=false;

        return;

    }


    /* MENU */

    if(
        screen==="menu"
    ){

        if(
            key==="1"
        ){

            startMode(
                "tower"
            );

        }

        else if(
            key==="2"
        ){

            screen="modes";

        }

        else if(
            key==="3"
        ){

            screen="shop";

        }

        else if(
            key==="4"
        ){

            screen="effects";

        }

        else if(
            key==="5"
        ){

            screen="character";

        }

        else if(
            key==="6"
        ){

            screen="inventory";

        }

        else if(
            key==="7"
        ){

            screen="missions";

        }

        else if(
            key==="8"
        ){

            screen="ranking";

        }

        return;

    }


    /* MODOS */

    if(
        screen==="modes"
    ){

        if(
            key==="1"
        ){

            startMode("tower");

        }

        if(
            key==="2"
        ){

            startMode("survival");

        }

        if(
            key==="3"
        ){

            startMode("challenge");

        }

        if(
            key==="4"
        ){

            startMode("training");

        }

        if(
            key==="n"
        ){

            startNewGamePlus();

        }

        return;

    }


    /* LOJA */

    if(
        screen==="shop"
    ){

        const number=
            Number(key);


        const ids=
            Object.keys(
                outfits
            );


        if(
            number>=1 &&
            number<=ids.length
        ){

            buyOutfit(
                ids[
                    number-1
                ]
            );

        }


        return;

    }


    /* EFEITOS */

    if(
        screen==="effects"
    ){

        const number=
            Number(key);


        const ids=
            Object.keys(
                effects
            );


        if(
            number>=1 &&
            number<=ids.length
        ){

            buyEffect(
                ids[
                    number-1
                ]
            );

        }


        return;

    }


    /* PERSONAGEM */

    if(
        screen==="character"
    ){

        if(
            key==="1"
        ){

            selectCharacter(
                "guerreiro"
            );

        }

        if(
            key==="2"
        ){

            selectCharacter(
                "tanque"
            );

        }

        if(
            key==="3"
        ){

            selectCharacter(
                "veloz"
            );

        }

        return;

    }


    /* MISSÕES */

    if(
        screen==="missions"
    ){

        const index=
            Number(key)-1;


        if(
            index>=0 &&
            index<missions.length
        ){

            claimMission(index);

        }

        return;

    }


    /* INVENTÁRIO */

    if(
        screen==="inventory" &&
        key==="c"
    ){

        screen="character";

        return;

    }


    /* BAÚ */

    if(
        screen==="game" &&
        key==="q"
    ){

        openChest();

        keys["q"]=false;

        return;

    }

}


/* =========================================================
   COMPRA
========================================================= */

function buyOutfit(
    id
){

    const item=
        outfits[id];


    if(
        purchasedOutfits
            .includes(id)
    ){

        currentOutfit=id;


        saveGame();


        popup(
            `${item.name} equipada`
        );


        return;

    }


    if(
        coins<
        item.price
    ){

        popup(
            "Moedas insuficientes!"
        );


        sound(
            100,
            .12,
            "square",
            .05
        );


        return;

    }


    coins-=
        item.price;


    purchasedOutfits.push(id);


    currentOutfit=id;


    saveGame();


    popup(
        `${item.name} desbloqueada!`
    );


    sound(
        700,
        .15,
        "sine",
        .08
    );

}


function buyEffect(
    id
){

    const item=
        effects[id];


    if(
        purchasedEffects
            .includes(id)
    ){

        currentEffect=id;


        saveGame();


        popup(
            `${item.name} equipado`
        );


        return;

    }


    if(
        coins<
        item.price
    ){

        popup(
            "Moedas insuficientes!"
        );


        return;

    }


    coins-=
        item.price;


    purchasedEffects.push(id);

    currentEffect=id;


    saveGame();


    popup(
        `${item.name} desbloqueado!`
    );

}


function selectCharacter(
    id
){

    currentCharacter=id;


    saveGame();


    resetPlayer();


    popup(
        `${characters[id].name} selecionado`
    );

}


/* =========================================================
   START MODE
========================================================= */

function startMode(
    selectedMode
){

    screen="game";


    mode=
        selectedMode;


    floor=1;


    survivalWave=1;


    points=0;


    combo=0;


    maxCombo=0;


    waitingNext=false;

    gameOver=false;

    victoryDance=false;


    eventType="normal";

    eventTimer=0;


    challengeProgress=0;


    chestAvailable=false;


    particles=[];


    ngPlusRun=
        selectedMode==="tower" &&
        newGamePlusUnlocked;


    resetPlayer();


    if(
        selectedMode==="survival"
    ){

        createSurvivalEnemy();

    }
    else{

        createEnemy();

    }


    if(
        selectedMode==="challenge"
    ){

        popup(
            "DESAFIO INICIADO!"
        );

    }


    if(
        selectedMode==="training"
    ){

        popup(
            "MODO TREINO"
        );

    }

}


/* =========================================================
   LOOP
========================================================= */

function update(){

    if(
        screen==="game"
    ){

        updatePlayer();

        updateEnemy();

        updateHeal();

        updatePowerup();

        updateEvent();

        updateParticles();


        if(
            dialogueTimer>0
        ){

            dialogueTimer--;

        }


        if(
            screenShake>0
        ){

            screenShake--;

        }


        if(
            screenFlash>0
        ){

            screenFlash--;

        }

    }

}


function render(){

    ctx.save();


    if(
        screenShake>0
    ){

        ctx.translate(
            random(
                -screenShake,
                screenShake
            ),
            random(
                -screenShake,
                screenShake
            )
        );

    }


    if(
        screen==="menu"
    ){

        drawMenu();

    }


    else if(
        screen==="modes"
    ){

        drawModes();

    }


    else if(
        screen==="shop"
    ){

        drawShop();

    }


    else if(
        screen==="effects"
    ){

        drawEffectsScreen();

    }


    else if(
        screen==="character"
    ){

        drawCharacterScreen();

    }


    else if(
        screen==="inventory"
    ){

        drawInventory();

    }


    else if(
        screen==="missions"
    ){

        drawMissions();

    }


    else if(
        screen==="ranking"
    ){

        drawRanking();

    }


    else if(
        screen==="game"
    ){

        drawGame();

    }


    ctx.restore();


    if(
        screenFlash>0
    ){

        ctx.fillStyle=
            `rgba(255,255,255,${screenFlash*.025})`;


        ctx.fillRect(
            0,
            0,
            W,
            H
        );

    }


    drawPopup();

}


/* =========================================================
   CLIQUE NOS MENUS
========================================================= */

canvas.addEventListener(
    "click",
    event=>{

        startAudio();


        const rect=
            canvas.getBoundingClientRect();


        const scaleX=
            W/
            rect.width;


        const scaleY=
            H/
            rect.height;


        const x=
            (
                event.clientX-
                rect.left
            )*
            scaleX;


        const y=
            (
                event.clientY-
                rect.top
            )*
            scaleY;


        /* MENU */

        if(
            screen==="menu"
        ){

            if(
                inside(
                    x,
                    y,
                    450,
                    220,
                    380,
                    57
                )
            ){

                startMode(
                    "tower"
                );

            }

            else if(
                inside(
                    x,
                    y,
                    450,
                    289,
                    380,
                    57
                )
            ){

                screen="modes";

            }

            else if(
                inside(
                    x,
                    y,
                    450,
                    358,
                    380,
                    57
                )
            ){

                screen="shop";

            }

            else if(
                inside(
                    x,
                    y,
                    450,
                    427,
                    380,
                    57
                )
            ){

                screen="effects";

            }

            else if(
                inside(
                    x,
                    y,
                    450,
                    496,
                    380,
                    57
                )
            ){

                screen="character";

            }

            else if(
                inside(
                    x,
                    y,
                    450,
                    565,
                    380,
                    57
                )
            ){

                screen="inventory";

            }

            return;

        }


        /* MODOS */

        if(
            screen==="modes"
        ){

            if(
                inside(
                    x,
                    y,
                    150,
                    145,
                    420,
                    155
                )
            ){

                startMode("tower");

            }

            else if(
                inside(
                    x,
                    y,
                    650,
                    145,
                    420,
                    155
                )
            ){

                startMode("survival");

            }

            else if(
                inside(
                    x,
                    y,
                    150,
                    345,
                    420,
                    155
                )
            ){

                startMode("challenge");

            }

            else if(
                inside(
                    x,
                    y,
                    650,
                    345,
                    420,
                    155
                )
            ){

                startMode("training");

            }

            return;

        }


        /* LOJA */

        if(
            screen==="shop"
        ){

            const ids=
                Object.keys(
                    outfits
                );


            ids.forEach(
                (id,i)=>{

                    const bx=
                        95+
                        (i%3)*390;

                    const by=
                        120+
                        Math.floor(i/3)*175;


                    if(
                        inside(
                            x,
                            y,
                            bx,
                            by,
                            350,
                            140
                        )
                    ){

                        buyOutfit(id);

                    }

                }
            );


            return;

        }


        /* EFEITOS */

        if(
            screen==="effects"
        ){

            const ids=
                Object.keys(
                    effects
                );


            ids.forEach(
                (id,i)=>{

                    const bx=
                        95+
                        (i%3)*390;

                    const by=
                        125+
                        Math.floor(i/3)*180;


                    if(
                        inside(
                            x,
                            y,
                            bx,
                            by,
                            350,
                            145
                        )
                    ){

                        buyEffect(id);

                    }

                }
            );


            return;

        }


        /* PERSONAGEM */

        if(
            screen==="character"
        ){

            const ids=
                Object.keys(
                    characters
                );


            ids.forEach(
                (id,i)=>{

                    const bx=
                        145+
                        i*365;


                    if(
                        inside(
                            x,
                            y,
                            bx,
                            145,
                            300,
                            370
                        )
                    ){

                        selectCharacter(id);

                    }

                }
            );


            return;

        }

    }
);


function inside(
    x,
    y,
    bx,
    by,
    bw,
    bh
){

    return (
        x>=bx &&
        x<=bx+bw &&
        y>=by &&
        y<=by+bh
    );

}


/* =========================================================
   LOOP PRINCIPAL
========================================================= */

function loop(){

    update();

    render();

    requestAnimationFrame(
        loop
    );

}


resetPlayer();

createEnemy();

loop();

</script>
