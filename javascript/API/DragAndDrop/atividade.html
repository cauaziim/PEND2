<!DOCTYPE html>

<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>Drag and Drop API</title>

<link rel="stylesheet" href="atividade.css">


</head>

<body>


<div class="container">

    <h1>Magazine Luzia</h1>

    <div class="produtos">

        <div id="produto1" class="produto" draggable="true">
            💻 Notbook
        </div>

        <div id="produto2" class="produto" draggable="true">
            📱 Iphone 15
        </div>

        <div id="produto3" class="produto" draggable="true">
            🎮 Playstation 5
        </div>

        <div id="produto4" class="produto" draggable="true">
            🤖 Robô  
        </div>

        <div id="produto5" class="produto" draggable="true">
            🖥️ Monitor 4K
        </div>

        <div id="produto6" class="produto" draggable="true">
            ⌚ Smartwatch
        </div>

    </div>


    <div id="carrinho">

        <h2>🛒 Carrinho</h2>

        <div id="areaDrop">
            Arraste o produto para esta área
        </div>

        <div id="itensCarrinho"></div>

        <div class="total">
            Total: R$ <span id="total">0,00</span>
        </div>

    </div>

</div>


<script src="atividade.js"></script>


</body>

</html>
